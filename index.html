<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with Telegram</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            color: #2d3436;
            margin-bottom: 10px;
            font-size: 26px;
        }
        .login-card p {
            color: #636e72;
            margin-bottom: 30px;
            font-size: 15px;
        }
        /* কাস্টম টেলিগ্রাম বাটন ডিজাইন */
        .telegram-login-btn {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            transition: background 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(36, 129, 204, 0.3);
        }
        .telegram-login-btn:hover {
            background-color: #1b6ca8;
        }
        .telegram-login-btn:active {
            transform: scale(0.98);
        }
        .telegram-login-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
    </style>

    <!-- Telegram OIDC Script with your Client ID -->
    <script async 
        src="https://oauth.telegram.org/js/telegram-login.js?6" 
        id="telegram-login-script"
        data-client-id="8740083050" 
        data-onauth="onTelegramAuth(data)" 
        data-request-access="write">
    </script>
</head>
<body>

    <div class="login-card">
        <h2>Hello There! 👋</h2>
        <p>Sign in quickly & securely using your Telegram account</p>

        <!-- কাস্টম বাটন (যাতে ক্লিক করলে টেলিগ্রাম লগইন পপ-আপ ওপেন হবে) -->
        <button class="telegram-login-btn" onclick="triggerTelegramLogin()">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.37-.49 1.02-.75 3.98-1.73 6.64-2.87 7.98-3.44 3.8-1.62 4.59-1.9 5.1-1.91.11 0 .37.03.54.17.14.12.18.28.2.45-.02.07-.02.13-.04.2z"/></svg>
            Sign In with Telegram
        </button>
    </div>

    <script>
        // বাটনে ক্লিক করলে টেলিগ্রামের নিজস্ব অথেনটিকেশন উইন্ডো ওপেন করার ফাংশন
        function triggerTelegramLogin() {
            if (window.TelegramLogin && typeof window.TelegramLogin.auth === 'function') {
                window.TelegramLogin.auth();
            } else {
                // যদি স্ক্রিপ্ট পুরোপুরি লোড হতে একটু দেরি হয়
                console.log("Telegram login script is still loading, please wait a second.");
                alert("Please wait a moment and try again.");
            }
        }

        // সফলভাবে লগইন হওয়ার পর এই ফাংশনটি কল হবে
        function onTelegramAuth(user) {
            console.log("User Data:", user);
            
            // ইউজারের ডেটা লোকাল স্টোরেজে সেভ করছি
            localStorage.setItem('tg_user', JSON.stringify(user));
            
            // ড্যাশবোর্ডে রিডাইরেক্ট করে দিচ্ছি
            window.location.href = 'dashboard.html';
        }
    </script>

</body>
</html>
